<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nabin Bogati · Senior Backend Engineer</title>
        <meta
            name="description"
            content="Nabin Bogati builds real-time backends for multiplayer games and runs them in production: async Python, WebSockets, pub/sub, PostgreSQL, Redis and the Linux infrastructure underneath. 7+ years of experience."
        />
        <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://nabinbogati.com.np/" />
        <meta property="og:title" content="Nabin Bogati · Senior Backend Engineer" />
        <meta
            property="og:description"
            content="I build real-time backends for multiplayer games, and keep them running in production."
        />
        <meta property="og:image" content="https://nabinbogati.com.np/assets/profile.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <script>
            // Apply the saved or system theme before first paint to avoid a flash.
            (function () {
                var theme;
                try {
                    theme = localStorage.getItem("theme");
                } catch (e) {}
                if (theme !== "light" && theme !== "dark") {
                    theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                }
                document.documentElement.classList.add(theme);
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <div id="modal-root"></div>
        <script type="module" src="/index.tsx"></script>
    </body>
</html>
